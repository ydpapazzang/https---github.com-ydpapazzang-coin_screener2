name: Django tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      CRON_SECRET: "ci-cron-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run screener tests
        run: python manage.py test coinscreener.screener -v 2
