{% load humanize %}<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}관리자 백오피스{% endblock %} · wonii</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg: #0f1115;
            --surface: #181b21;
            --surface-2: #1f242c;
            --border: #2a2f38;
            --text: #e8eaed;
            --text-dim: #9aa3ad;
            --primary: #2d7bfe;
            --up: #f23645;
            --down: #2962ff;
            --green: #26a17b;
            --amber: #f5a623;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        h1,h2,h3,p { margin: 0; }

        /* Sidebar */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px 12px;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .brand { font-size: 16px; font-weight: 700; padding: 8px 12px 20px; }
        .brand small { color: var(--text-dim); font-weight: 500; }
        .nav a {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 14px; border-radius: 8px;
            color: var(--text-dim); font-size: 14px; font-weight: 500;
            margin-bottom: 2px;
        }
        .nav a:hover { background: var(--surface-2); color: var(--text); }
        .nav a.active { background: rgba(45,123,254,0.15); color: #6ea8ff; }
        .sidebar-foot { margin-top: auto; padding: 12px; font-size: 12px; color: var(--text-dim); }
        .sidebar-foot a { color: var(--primary); }

        /* Main */
        .main { flex: 1; padding: 28px 32px; max-width: 1200px; }
        .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
        .page-head h1 { font-size: 22px; font-weight: 700; }
        .page-head .sub { color: var(--text-dim); font-size: 13px; }

        /* Cards */
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 26px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
        .card .label { color: var(--text-dim); font-size: 13px; margin-bottom: 8px; }
        .card .value { font-size: 26px; font-weight: 700; }
        .card .value small { font-size: 14px; color: var(--text-dim); font-weight: 500; }
        .card .foot { margin-top: 8px; font-size: 12px; color: var(--text-dim); }

        .pos { color: var(--up); } .neg { color: var(--down); }
        .ok { color: var(--green); } .warn { color: var(--amber); }

        /* Section */
        .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 22px; }
        .section h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { color: var(--text-dim); font-weight: 500; font-size: 12px; }
        tr:hover td { background: var(--surface-2); }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .b-pending { background: #3a3f48; color: #cdd3db; }
        .b-active  { background: rgba(45,123,254,0.2); color: #6ea8ff; }
        .b-success { background: rgba(38,161,123,0.2); color: #4fd6a8; }
        .b-failed  { background: rgba(242,54,69,0.2); color: #ff7d88; }
        .b-closed, .b-skipped { background: #33383f; color: #9aa3ad; }

        /* Filters */
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .filters select, .filters input {
            background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
            padding: 8px 10px; border-radius: 8px; font-size: 13px;
        }
        .filters button {
            background: var(--primary); border: none; color: #fff; padding: 8px 16px;
            border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
        }

        /* Pagination */
        .pager { display: flex; gap: 8px; align-items: center; margin-top: 16px; font-size: 13px; color: var(--text-dim); }
        .pager a { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }

        /* Bar chart */
        .bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 10px; }
        .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .bar { width: 100%; max-width: 34px; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 2px; }
        .bar-lbl { font-size: 10px; color: var(--text-dim); margin-top: 6px; }
        .bar-val { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
        .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="brand">wonii <small>백오피스</small></div>
        <nav class="nav">
            <a href="{% url 'manage_dashboard' %}" class="{% if active == 'dashboard' %}active{% endif %}">📊 대시보드</a>
            <a href="{% url 'manage_alerts' %}" class="{% if active == 'alerts' %}active{% endif %}">🔔 알람 이력</a>
            <a href="{% url 'manage_danta' %}" class="{% if active == 'danta' %}active{% endif %}">⚡ 단타 이력</a>
            <a href="{% url 'manage_visits' %}" class="{% if active == 'visits' %}active{% endif %}">👣 방문 기록</a>
        </nav>
        <div class="sidebar-foot">
            <a href="{% url 'strategy_list' %}">← 앱으로</a> ·
            <a href="/admin/">Django Admin</a>
        </div>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
