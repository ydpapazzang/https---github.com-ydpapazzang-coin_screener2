{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - Coin Screener</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #2d7bfe;
            --text-primary: #ffffff;
            --text-secondary: #9e9e9e;
            --border-color: #2c2c2c;
            --danger-color: #f23645;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #0a0a0a;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px 28px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
            margin: 20px;
        }
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-icon {
            font-size: 38px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
        }
        .brand-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.4;
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            background: #ffffff;
            color: #1f1f1f;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-google:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .btn-google svg {
            width: 20px;
            height: 20px;
        }
        .notice-box {
            margin-top: 16px;
            padding: 12px 14px;
            background: rgba(45, 123, 254, 0.08);
            border: 1px solid rgba(45, 123, 254, 0.2);
            border-radius: 10px;
            font-size: 12px;
            color: #8bb4fe;
            line-height: 1.5;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #555;
            font-size: 12px;
            margin: 24px 0 16px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }
        .divider span {
            padding: 0 10px;
        }
        .admin-toggle {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            user-select: none;
        }
        .admin-toggle:hover {
            color: var(--text-primary);
        }
        .admin-form {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #141414;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .alert-error {
            background: rgba(242, 54, 69, 0.15);
            border: 1px solid rgba(242, 54, 69, 0.4);
            color: #ff737d;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <div class="brand-icon">📈</div>
        <h1 class="brand-title">Coin Screener</h1>
        <p class="brand-desc">허가된 사용자만 이용 가능한 비공개 스크리너입니다.<br>구글 계정으로 로그인해 주세요.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert-error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <a href="{% url 'google_login' %}?next={{ next }}" class="btn-google">
        <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google 계정으로 계속하기
    </a>

    <div class="notice-box">
        💡 <b>안내</b>: 처음 로그인하시는 경우 관리자의 승인이 완료된 후 서비스 이용이 가능합니다.
    </div>

    <div class="divider"><span>또는</span></div>

    <div class="admin-toggle" onclick="toggleAdminForm()">
        ⚙️ 관리자 직접 로그인 ▼
    </div>

    <form class="admin-form" id="admin-form" method="POST" action="{% url 'login' %}?next={{ next }}">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">관리자 아이디</label>
            <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">관리자 로그인</button>
    </form>
</div>

<script>
    function toggleAdminForm() {
        const form = document.getElementById('admin-form');
        form.style.display = (form.style.display === 'block') ? 'none' : 'block';
    }
</script>
</body>
</html>
