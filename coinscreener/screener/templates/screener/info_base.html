{% extends 'screener/base.html' %}
{% block extra_head %}
<style>
    .info-wrap { padding: 20px 20px 32px; }
    .info-wrap h1 { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
    .info-wrap .updated { color: var(--text-secondary); font-size: 12px; margin-bottom: 22px; }
    .info-wrap h2 { font-size: 16px; font-weight: 700; margin: 26px 0 10px; }
    .info-wrap p { font-size: 14px; line-height: 1.75; color: #d0d3d8; margin-bottom: 10px; }
    .info-wrap ul { padding-left: 18px; margin: 0 0 10px; }
    .info-wrap li { font-size: 14px; line-height: 1.8; color: #d0d3d8; }
    .info-wrap a { color: var(--primary-color); text-decoration: none; }
    .info-wrap .box {
        background: var(--surface-color); border: 1px solid var(--border-color);
        border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
        font-size: 14px; line-height: 1.7; color: #d0d3d8;
    }
    .info-wrap .muted { color: var(--text-secondary); font-size: 13px; }
</style>
{% block info_head %}{% endblock %}
{% endblock %}

{% block topbar %}
<header class="top-app-bar">
    <button class="icon-btn" onclick="if(history.length>1){history.back()}else{location.href='{% url 'more_menu' %}'}" aria-label="뒤로">
        <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
    </button>
    <div class="title">{% block page_title %}{% endblock %}</div>
    <div style="width:32px"></div>
</header>
{% endblock %}

{% block content %}
<div class="info-wrap">
    {% block body %}{% endblock %}
</div>
{% endblock %}
